; PlatformIO Project Configuration for Stack-chan on M5Stack Core2
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
platform = espressif32@6.5.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Core2 specific settings
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs   ; enables pio run -t uploadfs for data/config.json
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.psram_speed = 80   ; PSRAM SPI bus 40→80 MHz — 2× buffer throughput

; Libraries
lib_deps =
    m5stack/M5Unified@^0.2.0
    meganetaaan/M5Stack-Avatar@^0.9.2
    madhephaestus/ESP32Servo@^1.2.1
    ftservo/FTServo@^2.0.0
    bblanchon/ArduinoJson@^7.0.0
    earlephilhower/ESP8266SAM          ; offline TTS fallback (SAM robotic voice)
    m5stack/M5Module-LLM@^1.7.0       ; K144 / AX630C local LLM module (AI_PROVIDER_LOCAL)
    links2004/WebSockets@^2.3.6       ; OpenAI Realtime API (WSS WebSocket client)

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_M5STACK_CORE2
    ; Increase the Arduino loop() task stack from the default 8 KB to 16 KB.
    ; HTTP + JSON + TTS call chains are deep and have overflowed the default.
    ; Undefine first to silence the "redefined" warning from sdkconfig.h.
    -UCONFIG_ARDUINO_LOOP_STACK_SIZE
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; FreeRTOS stack canary — mode 2 = check on context switch (cheap, catches overflows fast)
    -DconfigCHECK_FOR_STACK_OVERFLOW=2
    ; WebSockets library receive buffer — large enough for Realtime API audio delta frames
    -DWEBSOCKETS_MAX_DATA_SIZE=65536
    
; Extra scripts for custom build steps
extra_scripts = pre:scripts/version.py
